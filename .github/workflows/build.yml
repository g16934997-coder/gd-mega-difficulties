name: Build Geode Mod

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli-action@v2
        with:
          sdk: true

      - name: Build the mod
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGeode_DIR="${{ env.GEODE_SDK }}" -DCMAKE_PREFIX_PATH="${{ env.GEODE_SDK }}"
          cmake --build build --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}
          path: build/*.geode
          
          
